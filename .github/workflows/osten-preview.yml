name: OSTen preview image

on:
  # Validate the resource framework before changing the known-good desktop.
  pull_request:
    branches: [osten/main]
  push:
    branches: [osten/main]
    paths:
      - .github/workflows/osten-preview.yml
      - build/jam/DefaultBuildProfiles
      - build/jam/images/definitions/common-tail
      - build/osten/tools/boot-smoke
      - build/osten/tools/finder-input-smoke.py
      - build/osten/tools/verify-window-chrome.py
      - data/launch/user
      - src/apps/Jamfile
      - src/apps/osten/**
      - data/osten/resources/**
      - docs/osten/SoftwareStandard.md
      - src/apps/deskbar/**
      - src/add-ons/decorators/**
      - src/servers/app/Jamfile
      - src/servers/app/Desktop.cpp
      - src/servers/app/decorator/**
      - src/servers/app/stackandtile/**
      - src/kits/tracker/**
      - src/servers/launch/LaunchDaemon.cpp

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex texinfo autoconf automake gawk nasm \
            wget zip unzip xorriso mtools python3 pkg-config zlib1g-dev \
            libzstd-dev libgmp-dev libmpfr-dev libmpc-dev qemu-system-x86 \
            socat python3-pil tesseract-ocr

      - name: Check out Haiku buildtools
        run: |
          git clone --depth 1 https://github.com/haiku/buildtools.git ../buildtools
          if [ "$(git -C ../buildtools rev-parse HEAD)" != 8375c2dbeaf109c520798cb234d57f0895463201 ]; then
            git -C ../buildtools fetch --depth 1 origin 8375c2dbeaf109c520798cb234d57f0895463201
            git -C ../buildtools checkout --detach 8375c2dbeaf109c520798cb234d57f0895463201
          fi

      - name: Build Jam
        run: |
          make -C ../buildtools/jam -j4
          mkdir -p ../host-tools/bin
          ( cd ../buildtools/jam && ./jam0 -sBINDIR="$(realpath ../../host-tools/bin)" install )

      - name: Build cross compiler
        run: |
          mkdir -p generated.x86_64
          cd generated.x86_64
          PATH="$(realpath ../../host-tools/bin):$PATH" \
            ../configure -j4 --cross-tools-source ../../buildtools \
            --build-cross-tools x86_64

      - name: Stage temporary MemoChip Replicant package
        run: |
          mkdir -p build/osten/test-packages
          curl --fail --location --retry 4 --retry-delay 3 \
            --output build/osten/test-packages/memochip-1.0-1-x86_64.hpkg \
            'https://downloads.sourceforge.net/project/misc-haiku-utilities-and-ports/memochip/memochip-1.0-1-x86_64.hpkg'
          test -s build/osten/test-packages/memochip-1.0-1-x86_64.hpkg
          test "$(head -c 4 build/osten/test-packages/memochip-1.0-1-x86_64.hpkg)" = "hpkg"
          sha256sum build/osten/test-packages/memochip-1.0-1-x86_64.hpkg

      - name: Build preview image
        run: |
          cd generated.x86_64
          PATH="$(realpath ../build/osten/tools):$(realpath ../../host-tools/bin):$PATH" \
            jam -q -j4 -sHAIKU_REVISION=osten-preview-e5a43367 -sOSTEN_TRANSFER_TESTS=1 -sOSTEN_MEMOCHIP_TEST=1 @nightly-osten-raw
          test -s osten-preview.image
          sha256sum osten-preview.image
          printf 'OSTen=%s\nbuildtools=%s\nprofile=nightly-osten-raw\ntransfer-tests=1\nmemochip-test=1\n' \
            "$GITHUB_SHA" "$(git -C ../../buildtools rev-parse HEAD)" \
            > build-manifest.txt

      - name: Save preview image
        uses: actions/upload-artifact@v6
        with:
          name: osten-preview-${{ github.sha }}
          path: |
            generated.x86_64/osten-preview.image
            generated.x86_64/build-manifest.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Boot preview image
        run: |
          OSTEN_TRANSFER_TESTS=1 OSTEN_VERIFY_WINDOW_CHROME=1 bash build/osten/tools/boot-smoke generated.x86_64/osten-preview.image preview-boot
          /usr/bin/python3 - <<'PY'
          from PIL import Image

          for name in ('welcome', 'screenshot', 'finder', 'context-menu', 'transfer-tests'):
              image = Image.open(f'preview-boot/{name}.ppm').convert('RGB')
              image.save(f'preview-boot/{name}.png')
              print(f'{name}: {image.width}x{image.height}')

          desktop = Image.open('preview-boot/screenshot.png').convert('RGB')
          finder = Image.open('preview-boot/finder.png').convert('RGB')
          desktop_white = sum(all(channel >= 235 for channel in pixel)
              for pixel in desktop.getdata())
          finder_white = sum(all(channel >= 235 for channel in pixel)
              for pixel in finder.getdata())
          added_white = finder_white - desktop_white
          print(f'Finder added bright pixels: {added_white}')
          if added_white < 50000:
              raise SystemExit('Finder window did not appear in boot evidence')
          # The smoke script verifies the title bar before its input tests.
          PY
          grep -F "OSTEN_TRANSFER_TESTS_PASS 21" preview-boot/serial.log
          cp generated.x86_64/build-manifest.txt preview-boot/build-manifest.txt

      - name: Save preview boot evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: osten-preview-boot-${{ github.sha }}
          path: preview-boot/
          if-no-files-found: warn
          retention-days: 7
